name: Publish Carry Geometry v0.2.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.2.0.yml

permissions:
  contents: write

concurrency:
  group: publish-carry-geometry-v0.2.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'thiagomassensini/carry-geometry'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_NOTES: |
        ## Finite camera transport

        This release extends the positional foundation with kernel-checked
        transport between finite multibase cameras.

        ### Formalized results

        - exact equivalence between admissible digit windows and their finite
          residual coordinate spaces;
        - matched-camera equivalences only under equality of state counts;
        - value preservation, reverse transport, coherent composition, and
          exact round-trip for matched windows;
        - canonical value-preserving camera embeddings under ordered state
          counts;
        - agreement with the matched equivalence at equality and formal
          non-surjectivity at strict inequality;
        - signal pushforward by extension by zero, restriction, and the
          idempotent projection onto the embedded image;
        - compression-weighted transforms with exact intertwining;
        - compressed quadratic-energy and centered-bracket preservation;
        - partial-isometry identities: reverse-after-forward is the source
          identity, while forward-after-reverse is image projection.

        ### Logical boundary

        Equal finite state counts produce an actual equivalence. Ordered,
        unequal counts produce an embedding and retraction, not a fabricated
        two-sided inverse on the entire target. No Green, Weyl, spectral,
        prime, zeta, or analytic-continuation claim is introduced here.

        ### Verification

        - release target: 07b4e7ad17acade6b91308357847dfff5821eacc;
        - public root builds with warnings treated as errors;
        - the explicit axiom audit and sexagesimal examples pass;
        - the audited results use only propext, Classical.choice, and
          Quot.sound;
        - CI rejects local sorry, admit, axiom, and unsafe declarations;
        - CITATION.cff and .zenodo.json identify version 0.2.0 and the
          2026-08-14 release date.
    steps:
      - name: Create tag and GitHub release
        run: |
          set -euo pipefail
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.2.0 already exists."
            exit 0
          fi
          gh release create v0.2.0             --repo "$GITHUB_REPOSITORY"             --target 07b4e7ad17acade6b91308357847dfff5821eacc             --title "Carry Geometry v0.2.0"             --notes "$RELEASE_NOTES"
